<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .radar-sweep {
        transform-origin: 1050px 210px;
        animation: rotateSweep 8s linear infinite;
      }
      .radar-ring {
        transform-origin: 1050px 210px;
        animation: pulseRing 4s ease-out infinite;
      }
      .data-packet {
        animation: flowPacket 3s ease-in-out infinite;
      }
      .data-packet-2 {
        animation: flowPacket 4.5s ease-in-out infinite 1.5s;
      }
      .floating-pill {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .floating-pill-2 {
        animation: floatPill2 5s ease-in-out infinite alternate 1s;
      }
      .grid-pulse {
        animation: gridPulse 4s ease-in-out infinite alternate;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 40px; opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { r: 180px; opacity: 0; }
      }
      @keyframes flowPacket {
        0% { stroke-dashoffset: 600; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes gridPulse {
        0% { opacity: 0.12; }
        100% { opacity: 0.28; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Cyber Grid (Background Layer) -->
  <g class="grid-pulse" stroke="#00F0FF" stroke-width="0.75" opacity="0.18">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>

    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="250" y1="0" x2="250" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="850" y1="0" x2="850" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="1150" y1="0" x2="1150" y2="420"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#3B82F6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="210" r="160" fill="#00F0FF" opacity="0.1" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="180" fill="#8B5CF6" opacity="0.12" filter="url(#glow)"/>

  <!-- Background Animated Network / Telemetry Streams (Behind Content) -->
  <g opacity="0.45">
    <path d="M 50 360 C 300 360, 400 390, 700 340 C 950 300, 1050 260, 1150 210" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M 50 360 C 300 360, 400 390, 700 340 C 950 300, 1050 260, 1150 210" fill="none" stroke="url(#cyberCyan)" stroke-width="2.5" stroke-dasharray="120 480" class="data-packet"/>

    <path d="M 120 40 C 400 100, 700 30, 920 120 C 1000 160, 1040 180, 1050 210" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M 120 40 C 400 100, 700 30, 920 120 C 1000 160, 1040 180, 1050 210" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="100 500" class="data-packet-2"/>
  </g>

  <!-- Interactive Radar Dynamic Display (Right Side Decorative Element) -->
  <g opacity="0.75">
    <!-- Concentric radar circles -->
    <circle cx="1050" cy="210" r="50" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.3"/>
    <circle cx="1050" cy="210" r="100" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.25"/>
    <circle cx="1050" cy="210" r="150" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.35"/>
    <circle cx="1050" cy="210" class="radar-ring" fill="none" stroke="#00F0FF" stroke-width="2"/>

    <!-- Crosshairs -->
    <line x1="880" y1="210" x2="1200" y2="210" stroke="#00F0FF" stroke-width="0.8" opacity="0.4"/>
    <line x1="1050" y1="40" x2="1050" y2="380" stroke="#00F0FF" stroke-width="0.8" opacity="0.4"/>

    <!-- Radar Sweep Beam -->
    <g class="radar-sweep">
      <defs>
        <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M 1050 210 L 1200 210 A 150 150 0 0 0 1156 104 Z" fill="url(#sweepGrad)"/>
    </g>

    <!-- Radar Blips -->
    <circle cx="1090" cy="160" r="4" fill="#00F0FF" filter="url(#subtleGlow)"/>
    <circle cx="980" cy="250" r="3.5" fill="#10B981" filter="url(#subtleGlow)"/>
    <circle cx="1120" cy="270" r="4.5" fill="#EC4899" filter="url(#subtleGlow)"/>
  </g>

  <!-- Main Content Foreground (Layered on top with high contrast) -->
  <g transform="translate(60, 48)">

    <!-- Top Badge / Category Pill -->
    <g class="floating-pill">
      <rect x="0" y="0" width="280" height="34" rx="17" fill="#0E1A36" stroke="#38BDF8" stroke-width="1.2" filter="url(#subtleGlow)"/>
      <circle cx="16" cy="17" r="5" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#38BDF8" letter-spacing="1">NEXT-GEN SIEM &amp; ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 82)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
        Awesome Next-Gen SIEM
      </text>
      <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#00F0FF" filter="url(#subtleGlow)">
        &amp; Security Analytics
      </text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Curated directory of AI-native SIEMs, security data lakes, behavioral analytics (UEBA),
    </text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      and production-grade open-source SOC detection &amp; response platforms.
    </text>

    <!-- Feature Tags Row (Foreground Floating Badges) -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g class="floating-pill">
        <rect x="0" y="0" width="130" height="32" rx="8" fill="#131C31" stroke="#1E293B" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38BDF8">🤖 Agentic AI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)" class="floating-pill-2">
        <rect x="0" y="0" width="168" height="32" rx="8" fill="#131C31" stroke="#1E293B" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#A78BFA">🌊 Security Data Lakes</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(322, 0)" class="floating-pill">
        <rect x="0" y="0" width="144" height="32" rx="8" fill="#131C31" stroke="#1E293B" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#34D399">🎯 Sigma Rules</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(478, 0)" class="floating-pill-2">
        <rect x="0" y="0" width="176" height="32" rx="8" fill="#131C31" stroke="#1E293B" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F472B6">🛡️ Open-Source SOC</text>
      </g>
    </g>

    <!-- Bottom Metrics Strip -->
    <g transform="translate(0, 316)" opacity="0.95">
      <rect x="0" y="0" width="654" height="2" fill="url(#cyberCyan)"/>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">
        UPDATED MONTHLY • SAAS BENCHMARKS • ARCHITECTURE BREAKDOWNS • MITRE ATT&amp;CK
      </text>
    </g>

  </g>
</svg>
